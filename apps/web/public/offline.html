<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e99" />
    <title>ClinicFlow · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #17212b; font: 16px/1.6 system-ui, sans-serif; touch-action: manipulation; }
      main { max-width: 420px; background: white; padding: 28px; border: 1px solid #d7e0e8; border-radius: 16px; }
      h1 { font-size: 24px; }
      a { display: block; min-height: 44px; padding: 12px; border-radius: 8px; text-align: center; background: #0b6e99; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>ClinicFlow</p>
      <h1>You’re offline</h1>
      <p>Reconnect to open the clinic workspace. Booking and changes need an internet connection.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
