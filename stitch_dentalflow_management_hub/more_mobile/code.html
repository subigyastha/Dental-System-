<style>

<header class="fixed top-0 w-full z-50 bg-canvas border-b border-border flex items-center justify-between px-margin-page h-control-std w-full">
<div class="flex items-center gap-3">
<div class="w-7 h-7 rounded-full overflow-hidden bg-surface-container border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a female dentist, Dr. Julianne Moore, with a friendly expression. She is wearing a modern white clinical coat over a soft teal scrub top. The background is a clean, bright, and minimalist dental office with soft lighting and professional corporate aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEfp1QcXIeJ-JMuI5xAAcxEtPoxwhrp2TsUa6JMrP2dkGfuyQqQSu9yLjLCjCS-mJHBr2QW_51VIa-yRB0QsyI4-6E4fyF4Yt6X8FWc85Lho-SEYtllwEAfprq8GBOEkpSpXoq3hVr1QY5aQO0aKx8S2d3uj8IW2_GeKtHg4x5PpolQ139YOBNHWCg7bRa_4-I5MVNDv_fMU6YAY7KmsHL0-GPupXPDPC7T8ld2NNpqRLKrBCy88dgjRwjRGdgQ1l09DmMXQ3D4q8"/>

</div>

<main class="pt-[calc(theme(spacing.control-std)+16px)] pb-[calc(theme(spacing.utility-rail)+40px)] px-gutter">
<!-- Profile Summary Header (Slack-inspired profile anchor) -->
<section class="mb-6 flex items-center p-4 bg-canvas border border-border rounded-xl">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary font-bold overflow-hidden mr-4">
<img class="w-full h-full object-cover" data-alt="Close up portrait of Dr. Julianne Moore, mid-40s, professional and serene. High-key clinical lighting. The environment is a clean dental clinic with teals and purples in the decor. High-quality corporate photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHPeBGF8plo2BxhriFee9H9_Ig-Jv0nr2WbJqpvU7mZOXaN6EM-upSj-JKnzzslczaqYNebplR17moQ8_qt-gJq93fsf8j_g3YguymgZ4SY2Ii-V2kM2HV0SFMaUV_IbBAUPqovWOPfv97cjvL4IJKVDyudoP1xAsIjRgfXrcFsoiovxBuCxYCz0PyDxUuhTLWM94Z_8TO9XUa2B26uVEZswCMsuI__WOI-94fiNABePlseNoz14mTuqQJHGD6KaM1XDqIY3H3Zp8"/>
</div>
<div class="flex-1">
<h2 class="font-section-title text-section-title">Dr. Julianne Moore</h2>

</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</section>
<!-- Search Persistent Entry -->

<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="search">search</span>
<input class="w-full h-control-std pl-10 pr-4 bg-canvas border border-border rounded-lg font-base-body text-base-body focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all outline-none" placeholder="Search patients or records..." type="text"/>
</div>
</div>
<!-- Section: Clinical Operations -->
<div class="mb-8">
<h3 class="font-label-caps text-label-caps text-text-muted uppercase mb-3 px-1">Clinical Operations</h3>
<div class="space-y-px bg-border rounded-xl overflow-hidden border border-border">
<!-- Item: Attention Center -->
<button class="w-full flex items-center p-4 bg-canvas hover:bg-surface-container transition-colors group">
<div class="w-10 h-10 flex items-center justify-center rounded-lg bg-error-container text-on-error-container mr-4">
<span class="material-symbols-outlined" data-icon="priority_high">priority_high</span>
</div>
<span class="flex-1 text-left font-base-body text-base-body">Attention Center</span>
<div class="flex items-center">
<span class="bg-error text-on-error px-2 py-0.5 rounded-full text-[10px] font-bold mr-3 leading-none">4</span>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</div>
</button>

<span class="material-symbols-outlined" data-icon="event_repeat">event_repeat</span>
</div>
<span class="flex-1 text-left font-base-body text-base-body">Follow-ups</span>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Item: Patient Search -->

<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>

<div class="mb-8">

<button class="w-full flex items-center p-4 bg-canvas hover:bg-surface-container transition-colors group">

</button>
</div>
</div>
<!-- Section: Preferences -->
<div class="mb-8">
<h3 class="font-label-caps text-label-caps text-text-muted uppercase mb-3 px-1">System</h3>
<div class="space-y-px bg-border rounded-xl overflow-hidden border border-border">
<!-- Item: Profile & Preferences -->
<button class="w-full flex items-center p-4 bg-canvas hover:bg-surface-container transition-colors group">
<div class="w-10 h-10 flex items-center justify-center rounded-lg bg-surface-container text-on-surface-variant mr-4">

</div>

</div>
</div>

<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-border flex justify-around items-center h-utility-rail pb-safe w-full">
<!-- Tab: Schedule -->
<a class="flex flex-col items-center justify-center text-text-muted dark:text-outline-variant hover:bg-surface-container-low transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>

<!-- Tab: Book -->

</a>

<span class="material-symbols-outlined" data-icon="more_horiz" style="font-variation-settings: 'FILL' 1;">more_horiz</span>
<span class="font-label-metadata text-label-metadata">More</span>
</a>
</nav>
<script>
        // Micro-interaction: Subtle hover effects on buttons for a native app feel
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('opacity-80');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('opacity-80');
            });
        });
    </script>
