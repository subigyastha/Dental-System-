<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .slot-pill:active { transform: scale(0.95); transition: transform 0.1s ease; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top AppBar (from JSON guidance) -->
<header class="fixed top-0 w-full z-50 bg-canvas border-b border-border flex items-center justify-between px-margin-page h-control-std">
<div class="flex items-center gap-2">
<button class="p-2 -ml-2 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-page-title text-page-title text-primary">Book Appointment</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary">location_on</span>
</div>
</header>
<main class="flex-grow pt-[56px] pb-[120px] px-margin-page max-w-md mx-auto w-full">
<!-- Step Indicator -->
<div class="py-6">
<div class="flex items-center justify-between mb-2">
<span class="font-label-caps text-label-caps text-text-muted">STEP 1 OF 4</span>
<span class="font-label-metadata text-label-metadata text-primary font-bold">Choose Time</span>
</div>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full"></div>
</div>
</div>
<!-- Appointment Summary / Context -->
<div class="bg-canvas border border-border p-4 rounded-xl mb-6 flex flex-col gap-3">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-lg bg-surface flex items-center justify-center border border-border overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Close-up professional portrait of a female dentist, Dr. Julianne Moore, with a friendly expression, wearing clinical white scrubs. The lighting is bright and clinical, typical of a modern high-end dental office. The background is softly blurred with a hint of teal and purple accents, maintaining the professional corporate minimalist aesthetic of Central Dental." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAOyYgQHcT-lG27AUk51eF088EHDoouPmrkLFhmmUV4aJ4itciCF5umN-shRZtBnxXqEOcwXdv4kgmmgUKUKg_gWFTN5KLssy9agQfl8hYbp-5HN8iDxA7f6hghB4C8QKbAZQScwN66XwntnG8ELONUCRyL47_OCqnBIDiJS0AfRtTuIWiuwWfSgzyGN-4CEiy3Oksoo1XsFdYv3hg3yLzGqdONwWXdkW2zH_1WBHxslyxS7LhdkZrBdTzuAdOFiwndQ5PlNGtkYg"/>
</div>
<div>
<p class="font-label-caps text-label-caps text-brand-teal">PROVIDER</p>
<p class="font-section-title text-section-title text-on-surface">Dr. Julianne Moore</p>
</div>
</div>
<div class="pt-3 border-t border-border flex items-center justify-between">
<div>
<p class="font-label-caps text-label-caps text-brand-teal">SERVICE</p>
<p class="font-base-body text-base-body">Prophylaxis (Cleaning)</p>
</div>
<span class="material-symbols-outlined text-text-muted">edit</span>
</div>
</div>
<!-- Date Selector -->
<section class="mb-8">
<div class="flex items-center justify-between mb-4">
<h3 class="font-section-title text-section-title">October 2024</h3>
<button class="text-primary flex items-center gap-1 font-label-metadata">
<span class="material-symbols-outlined text-sm">calendar_month</span>
                    Calendar
                </button>
</div>
<div class="flex overflow-x-auto gap-3 no-scrollbar pb-2">
<!-- Days generator -->
<div class="flex flex-col items-center justify-center min-w-[56px] h-[72px] rounded-xl border border-border bg-canvas opacity-50">
<span class="font-label-caps text-label-caps">MON</span>
<span class="font-page-title text-page-title">21</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[56px] h-[72px] rounded-xl border border-border bg-canvas opacity-50">
<span class="font-label-caps text-label-caps">TUE</span>
<span class="font-page-title text-page-title">22</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[56px] h-[72px] rounded-xl border border-border bg-canvas opacity-50">
<span class="font-label-caps text-label-caps">WED</span>
<span class="font-page-title text-page-title">23</span>
</div>
<!-- Active Day: Oct 24 -->
<div class="flex flex-col items-center justify-center min-w-[64px] h-[80px] -mt-1 rounded-xl bg-primary text-on-primary ring-2 ring-primary ring-offset-2 ring-offset-surface">
<span class="font-label-caps text-label-caps">THU</span>
<span class="font-page-title text-page-title">24</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[56px] h-[72px] rounded-xl border border-border bg-canvas">
<span class="font-label-caps text-label-caps">FRI</span>
<span class="font-page-title text-page-title">25</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[56px] h-[72px] rounded-xl border border-border bg-canvas">
<span class="font-label-caps text-label-caps">SAT</span>
<span class="font-page-title text-page-title">26</span>
</div>
</div>
</section>
<!-- Time Slots Grid -->
<section>
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">schedule</span>
<h3 class="font-section-title text-section-title">Available Slots</h3>
</div>
<div class="grid grid-cols-3 gap-3">
<!-- Slot Item -->
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center transition-colors hover:bg-surface-container-low active:bg-surface-container-high" onclick="selectSlot(this)">
<span class="font-section-title text-section-title">08:00</span>
<span class="font-label-metadata text-label-metadata text-text-muted">AM</span>
</button>
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center transition-colors hover:bg-surface-container-low active:bg-surface-container-high" onclick="selectSlot(this)">
<span class="font-section-title text-section-title">08:30</span>
<span class="font-label-metadata text-label-metadata text-text-muted">AM</span>
</button>
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center transition-colors hover:bg-surface-container-low active:bg-surface-container-high" onclick="selectSlot(this)">
<span class="font-section-title text-section-title">09:00</span>
<span class="font-label-metadata text-label-metadata text-text-muted">AM</span>
</button>
<!-- Selected Slot (Example State) -->
<button class="slot-pill bg-secondary-container border border-on-secondary-container py-3 rounded-lg flex flex-col items-center" onclick="selectSlot(this)">
<span class="font-section-title text-section-title text-on-secondary-container">09:30</span>
<span class="font-label-metadata text-label-metadata text-on-secondary-container">AM</span>
</button>
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center opacity-40 cursor-not-allowed">
<span class="font-section-title text-section-title">10:00</span>
<span class="font-label-metadata text-label-metadata text-text-muted">AM</span>
</button>
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center transition-colors hover:bg-surface-container-low active:bg-surface-container-high" onclick="selectSlot(this)">
<span class="font-section-title text-section-title">10:30</span>
<span class="font-label-metadata text-label-metadata text-text-muted">AM</span>
</button>
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center transition-colors hover:bg-surface-container-low active:bg-surface-container-high" onclick="selectSlot(this)">
<span class="font-section-title text-section-title">11:00</span>
<span class="font-label-metadata text-label-metadata text-text-muted">AM</span>
</button>
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center transition-colors hover:bg-surface-container-low active:bg-surface-container-high" onclick="selectSlot(this)">
<span class="font-section-title text-section-title">11:30</span>
<span class="font-label-metadata text-label-metadata text-text-muted">AM</span>
</button>
<button class="slot-pill bg-canvas border border-border py-3 rounded-lg flex flex-col items-center transition-colors hover:bg-surface-container-low active:bg-surface-container-high" onclick="selectSlot(this)">
<span class="font-section-title text-section-title">01:00</span>
<span class="font-label-metadata text-label-metadata text-text-muted">PM</span>
</button>
</div>
</section>
</main>
<!-- Fixed Footer Action -->
<footer class="fixed bottom-0 w-full p-margin-page bg-canvas border-t border-border z-50">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-section-title text-section-title flex items-center justify-center gap-2 shadow-lg shadow-primary/10 active:scale-[0.98] transition-transform">
                Next
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Bottom Nav (Hidden for focused flow as per suppression rules) -->
<nav class="hidden md:hidden fixed bottom-0 w-full h-utility-rail bg-surface border-t border-border flex justify-around items-center px-4">
<!-- Suppressed for booking flow to focus on action -->
</nav>
<script>
        function selectSlot(element) {
            // Simple visual toggle for demonstration
            document.querySelectorAll('.slot-pill').forEach(pill => {
                pill.classList.remove('bg-secondary-container', 'border-on-secondary-container');
                pill.querySelectorAll('span').forEach(s => s.classList.remove('text-on-secondary-container'));
                
                if (!pill.classList.contains('opacity-40')) {
                    pill.classList.add('bg-canvas', 'border-border');
                    pill.querySelector('span').classList.add('text-on-surface');
                }
            });

            element.classList.remove('bg-canvas', 'border-border');
            element.classList.add('bg-secondary-container', 'border-on-secondary-container');
            element.querySelectorAll('span').forEach(s => s.classList.add('text-on-secondary-container'));
        }
    </script>
</body></html>
